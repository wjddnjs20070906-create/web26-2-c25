<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <title>2note_formLabel</title>
</head>
<body>
    <form>
        <table>
            <tr>
                <td><label for="name">이름</label></td>
                <td><input id="name" type="text"></td>
            </tr>
            <tr>
                <td>성별</td>
                <td>
                    <!--라디오 버튼의 name속성으로 여러 대상 중 하나만 선택하는 형태 구현-->
                    <input id="man" type="radio" name="gender" vaule="m">
                    <label for="man">남자</label>
                    <input id="woman" type="radio" name="gender" vaule="w">
                    <label for="woman">여자</label>
                </td>
            </tr>
        </table>
        <input type="submit" value="가입">
    </form>
</body>
</html>
