<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    
    <title>7.그림자와 그레이디언트 속성</title>
    <style>
        /* h1{text-shadow: 5px 5px 5px black;}
        .box{
            box-shadow: 10px 10px 30px black;
            border:3px solid black;
        } */

        .box{
            box-shadow: 10px 10px 10px black, 10px 10px 20px orange, 10px 10px 30px red;
            border:3px solid black;
            text-shadow: 10px 10px 10px black, 10px 10px 20px orange, 10px 10px 30px red;
        }

        .gradient{
            /* Permalink - use to edit and share this gradient: https://colorzilla.com/gradient-editor/#b8e1fc+0,a9d2f3+10,90bae4+25,90bcea+37,90bff0+50,6ba8e5+51,a2daf5+83,bdf3fd+100;Blue+Gloss+%231 */
            background: linear-gradient(to bottom, rgba(184,225,252,1) 0%,rgba(169,210,243,1) 10%,rgba(144,186,228,1) 25%,rgba(144,188,234,1) 37%,rgba(144,191,240,1) 50%,rgba(107,168,229,1) 51%,rgba(162,218,245,1) 83%,rgba(189,243,253,1) 100%); /* W3C, IE10+, FF16+, Chrome26+, Opera12+, Safari7+ */
        }
    </style>
</head>
<body>
    <h2>7.7. 그림자와 그레이디언트 속성</h2>
    <h3>1. text-shadow 속성</h3>
    <h3>2. box-shadow 속성</h3>

    <hr>
    <h1>Lorem ipsum dolor sit amet consectetur adipisicing elit.</h1>

    <hr>
    <p>이 문장은 그림자가 있습니다.</p>
    <div class="box">
        <h1>이 요소는 그림자가 있습니다.</h1>
    </div>

    <hr>
    <div class="gradient">
        <h1>CSS3 그레이디언트</h1>
    </div>
</body>
</html>
