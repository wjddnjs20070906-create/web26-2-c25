<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>4form_selectBaisc</title>
</head>
<body>
    <h2>4선택가능한 입력 양식</h2>
    <select>
        <option>김밥</option>
        <option>떡볶이</option>
        <option>순대</option>
        <option>어묵</option>
    </select>

    <h2>5여러 항목 선택하기</h2>
    <select multiple="multiple">
        <option>김밥</option>
        <option>떡볶이</option>
        <option>순대</option>
        <option>어묵</option>
    </select>

    <h2>6선택 옵션묶기</h2>
    <select>
        <optgroup label="HTML5">
        <option>Multimedia Tag</option>
        <option>Connectivity</option>
        <option>Device Access</option>
        </optgroup>
        <optgroup label="CSS3">
        <option>Animation</option>
        <option>3D Transform</option>
        </optgroup>
    </select>
</body>
</html>
